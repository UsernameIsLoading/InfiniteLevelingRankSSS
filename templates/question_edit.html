{% extends 'base.html' %}{% block title %}Editar questão • Biblioteca{% endblock %}{% block content %}
<div class="page-heading"><div class="eyebrow">ADMINISTRAÇÃO DA BIBLIOTECA · QUESTÃO #{{ q.id }}</div><h1>Editar <span class="glow">questão</span></h1><p class="muted">Confere a resposta e a explicação, especialmente em questões geradas por IA ou importadas.</p></div>
<section class="panel"><form method="post" class="stack-form"><div class="form-row"><label>Disciplina<input name="subject" value="{{ q.subject }}" required maxlength="100"></label><label>Nível<input name="level" value="{{ q.level }}" required maxlength="100"></label></div><label>Assunto<input name="topic" value="{{ q.topic }}" required maxlength="160"></label><label>Dificuldade<select name="difficulty">{% for d in ['Básica','Intermediária','Avançada','Especialista'] %}<option {% if q.difficulty == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></label><label>Enunciado<textarea name="prompt" rows="4" required>{{ q.prompt }}</textarea></label><label>Alternativas (uma por linha; deixe vazio para resposta curta)<textarea name="options" rows="5">{{ options|join('\n') }}</textarea></label><label>Resposta correta<input name="answer" value="{{ q.answer }}" required></label><label>Explicação<textarea name="explanation" rows="4">{{ q.explanation }}</textarea></label><label>Fonte<input name="source" value="{{ q.source or '' }}" maxlength="255"></label><div class="row"><button class="btn primary">SALVAR ALTERAÇÕES</button><a class="btn secondary" href="{{ url_for('answer_question', qid=q.id) }}">CANCELAR</a></div></form></section>
{% endblock %}
