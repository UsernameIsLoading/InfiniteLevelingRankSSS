services:
  - type: web
    name: necromante-estacao-seul
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: necromante-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_PASSWORD
        sync: false
      - key: QUESTHUB_INTEGRATION_TOKEN
        sync: false
      - key: QUESTHUB_BASE_URL
        sync: false
      - key: QUESTHUB_USER_ID
        sync: false
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: necromante-db
    plan: free
    databaseName: necromante
    user: necromante_user
